[versions]
# Kotlin / Build Tooling
kotlin = "2.4.10"
ksp = "2.3.10"
agp = "9.1.1"
detekt = "1.23.8"
ktlint = "14.2.0"
ktlint-cli = "1.8.0"
dependencyAnalysis = "3.18.0"

# SDK Versions
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "35"

# Compose
composeMultiplatform = "1.11.1"
composeCompiler = "2.4.10"     # bundled with Kotlin now, but pin explicitly

# Coroutines / Serialization / DateTime
coroutines = "1.11.0"
material3 = "1.9.0"
serialization = "1.9.0"
kotlinxDatetime = "0.7.1"

# Networking
ktor = "3.5.1"
exposed = "0.59.0"
postgresql = "42.7.5"
h2 = "2.3.232"
hikaricp = "6.2.1"
bcrypt = "0.10.2"
flyway = "11.3.4"
logback = "1.5.17"
stream-java = "1.45.0"
micrometer = "1.14.4"

# DI
koin = "4.0.2"
koinAnnotations = "2.3.1"

# Navigation / Lifecycle
lifecycleViewmodel = "2.10.0" # androidx.lifecycle multiplatform artifact
navigation3 = "1.1.1"
adaptive = "1.3.0-beta02"
lifecycle = "2.11.0"

# Database
room = "2.8.4"
sqliteBundled = "2.6.0"       # androidx.sqlite driver, used by Room KMP

# Image loading
coil = "3.5.0"

# Calendar (Kizitonwose)
kizitonwoseCalendar = "2.10.0"

# Interop
skie = "0.10.14"

# Circuit (Slack) + Molecule (Cash App) - shared presenter architecture
circuit = "0.36.1"
molecule = "2.2.0"
ksafe = "2.2.1"

# Logging / Settings
napier = "2.7.1"
multiplatformSettings = "1.3.0"

# Testing
kotest = "6.0.5"
turbine = "1.2.1"
mockative = "3.3.2"
kover = "0.9.2"
robolectric = "4.14.1"
androidx-test-ext-junit = "1.2.1"
androidx-test-runner = "1.6.2"

# Utility
qrose = "1.1.2"
lucideIcons = "1.1.0"
compose-materialIconsExtended = "1.7.3"
cmptoast = "1.0.71"
streamChat = "6.4.0"
jakarta-inject = "2.0.1"

[libraries]
# KSafe
ksafe = { module = "eu.anifantakis:ksafe", version.ref = "ksafe" }
ksafe-compose = { module = "eu.anifantakis:ksafe-compose", version.ref = "ksafe" }
