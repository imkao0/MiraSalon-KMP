#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx6g

#Gradle
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
skipAndroid=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# KMP Build Stability Improvements
# Ignore disabled iOS targets on ARM64 Mac
kotlin.native.ignoreDisabledTargets=true
# Enable memory management for native targets
kotlin.native.memory.model=strict
# Disable binary compatibility validator for faster builds
kotlin.mpp.enableCInteropCommonization=true

# Fix for AndroidLocationsBuildService in sandboxed/CI environments
systemProp.android.user.home=./.android_home
