#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4g

#Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true
skipAndroid=false
systemProp.android.user.home=/Users/mac/Downloads/Folders/MiraSalon-KM/.gradle/android_home

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# KMP Build Stability Improvements
# Ignore disabled iOS targets on ARM64 Mac
kotlin.native.ignoreDisabledTargets=true
# Enable memory management for native targets
kotlin.native.memory.model=strict
# Disable binary compatibility validator for faster builds
kotlin.mpp.enableCInteropCommonization=true
