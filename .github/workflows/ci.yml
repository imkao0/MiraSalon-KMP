name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Run Linting
        run: ./gradlew detekt ktlintCheck
        
      - name: Dependency Analysis
        run: ./gradlew buildHealth
        
      - name: Build and Test
        run: ./gradlew build

  ios-verify:
    runs-on: macos-latest
    # Only run if there are iOS tests to run
    # For now, we'll keep it simple as per instructions
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Run iOS Tests
        run: ./gradlew iosSimulatorArm64Test
